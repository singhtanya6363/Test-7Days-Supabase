name: Supabase keepalive

on:
  push:
    paths:
      - '.github/workflows/supabase-keepalive.yml' # Runs once when you commit this file, so you get instant proof
  schedule:
    - cron: '17 */12 * * *' # Every 12 hours (UTC), off the top of the hour
  workflow_dispatch: # Lets you run it by hand from the Actions tab

permissions: {}

concurrency:
  group: supabase-keepalive-kznxvnwyywbfqtfnfgbh
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SUPABASE_PROJECT_REF: kznxvnwyywbfqtfnfgbh
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping Supabase and stamp the heartbeat row
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_PUBLISHABLE_KEY:?Add SUPABASE_PUBLISHABLE_KEY to repository Actions secrets}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 --retry-max-time 110 \
            --request POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/keepalive_ping" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"source\": \"github-action ${GITHUB_EVENT_NAME} run ${GITHUB_RUN_ID}\"}" \
            --output "$response_file"

          # A successful ping returns a timestamp like "2026-11-24T12:44:34.93+00:00"
          if ! jq -e 'type == "string" and length > 0' "$response_file" > /dev/null; then
            echo "::error::Unexpected response from Supabase. Check the project, key and keepalive table."
            exit 1
          fi
          echo "Keepalive succeeded. Supabase recorded the ping at $(jq -r . "$response_file")"
